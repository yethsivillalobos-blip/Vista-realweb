<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar visita — Vista Real</title>
<meta name="description" content="Verificación de códigos QR de visitantes del Conjunto Residencial Vista Real.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15140F;
    --paper:#FFFFFF;
    --paper-soft:#F5F4EF;
    --gold:#C69A3B;
    --gold-deep:#A97F27;
    --line: rgba(21,20,15,0.14);
    --radius: 2px;
    --max: 720px;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Archivo', system-ui, sans-serif;
    font-weight:400;
    font-size:17px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  img,svg{display:block;max-width:100%;}
  a{color:inherit;}

  h1,h2,h3{
    font-family:'Archivo', system-ui, sans-serif;
    font-weight:900;
    letter-spacing:-0.03em;
    line-height:1.02;
    margin:0;
  }

  p{ font-weight:400; }

  .eyebrow{
    font-family:'Archivo', system-ui, sans-serif;
    font-weight:700;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-deep);
  }

  .wrap{
    max-width:var(--max);
    margin:0 auto;
    padding:0 24px;
  }

  :focus-visible{
    outline:3px solid var(--gold-deep);
    outline-offset:3px;
  }

  /* ---------- Roofline motif (signature element) ---------- */
  .roofline{
    width:100%;
    height:34px;
    display:block;
  }
  .roofline path{
    fill:none;
    stroke:var(--gold);
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* ---------- Site header / nav ---------- */
  .site-header{
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--max);
    margin:0 auto;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
  }
  .brand-link{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
  }
  .brandmark{ width:34px; height:34px; flex-shrink:0; }
  .brandmark path{ fill:var(--gold); }
  .brandtext{
    display:flex;
    flex-direction:column;
    font-family:'Archivo', system-ui, sans-serif;
    font-weight:600;
    font-size:0.68rem;
    letter-spacing:0.08em;
    line-height:1.3;
  }
  .brandtext strong{
    font-weight:800;
    color:var(--ink);
    font-size:0.78rem;
    letter-spacing:0.04em;
  }
  .brandtext span:first-child{ color:rgba(21,20,15,0.55); }

  .nav-toggle{
    display:inline-flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;
    width:36px;
    height:36px;
    padding:0;
    background:none;
    border:none;
    cursor:pointer;
    flex-shrink:0;
  }
  .nav-toggle span{
    display:block;
    width:20px;
    height:2px;
    background:var(--ink);
    transition:transform .2s ease, opacity .2s ease;
  }
  .nav-toggle[aria-expanded="true"] span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
  .nav-toggle[aria-expanded="true"] span:nth-child(2){ opacity:0; }
  .nav-toggle[aria-expanded="true"] span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }

  .site-nav{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    display:flex;
    flex-direction:column;
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
  }
  .site-nav.is-open{ max-height:280px; }
  .site-nav a{
    padding:14px 24px;
    text-decoration:none;
    font-weight:600;
    font-size:0.95rem;
    border-top:1px solid var(--line);
  }
  .site-nav a[aria-current="page"]{ color:var(--gold-deep); }

  @media (min-width:720px){
    .nav-toggle{ display:none; }
    .site-nav{
      position:static;
      max-height:none;
      overflow:visible;
      flex-direction:row;
      background:none;
      border-bottom:none;
    }
    .site-nav a{
      padding:0;
      border-top:none;
      margin-left:32px;
      font-size:0.92rem;
    }
  }

  /* ---------- Page hero (interior pages) ---------- */
  .page-hero{
    padding:52px 0 40px;
  }
  .page-hero h1{
    font-size:2.4rem;
  }
  .page-hero .sub{
    margin-top:18px;
    font-size:1.05rem;
    font-weight:400;
    color:rgba(21,20,15,0.68);
    max-width:48ch;
    line-height:1.6;
  }
  @media (min-width:720px){
    .page-hero h1{ font-size:3.2rem; }
  }

  /* ---------- Divider ---------- */
  .divider-wrap{ background:var(--paper-soft); }
  .divider-wrap .roofline path{ stroke:var(--ink); opacity:0.12; }

  /* ---------- Buttons ---------- */
  .cta-group{
    margin-top:32px;
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:flex-start;
  }
  .btn{
    font-family:'Archivo', system-ui, sans-serif;
    font-weight:700;
    font-size:1rem;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:15px 28px;
    border-radius:var(--radius);
    border:2px solid transparent;
    transition:transform .2s ease, background .2s ease, border-color .2s ease;
    width:100%;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--ink);
    color:var(--paper);
  }
  .btn-primary:hover{ background:var(--gold-deep); transform:translateY(-2px); }
  .btn-secondary{
    background:transparent;
    color:var(--ink);
    border-color:var(--line);
    font-size:0.92rem;
    padding:12px 24px;
  }
  .btn-secondary:hover{ border-color:var(--ink); transform:translateY(-2px); }

  @media (min-width:560px){
    .cta-group{ flex-direction:row; align-items:center; }
    .btn{ width:auto; }
  }

  /* ---------- About body ---------- */
  .about{
    background:var(--paper-soft);
    padding:52px 0 60px;
  }
  .about .intro{
    max-width:60ch;
  }
  .about .intro p{
    margin:0 0 16px;
    color:rgba(21,20,15,0.72);
    font-size:1.02rem;
    line-height:1.7;
  }
  .about .intro p:last-child{ margin-bottom:0; }
  .benefit-list{
    display:grid;
    gap:20px;
    margin-top:36px;
  }
  .benefit{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:4px solid var(--gold);
    padding:24px 22px;
  }
  .benefit .eyebrow{ margin-bottom:10px; }
  .benefit h3{
    font-size:1.15rem;
    font-weight:700;
    margin-bottom:8px;
  }
  .benefit p{
    margin:0;
    font-weight:400;
    color:rgba(21,20,15,0.68);
    font-size:0.98rem;
    line-height:1.6;
  }

  @media (min-width:720px){
    .benefit-list{ grid-template-columns:repeat(3,1fr); }
  }

  /* ---------- Final CTA ---------- */
  .final-cta{
    background:var(--ink);
    color:var(--paper);
    padding:56px 0 60px;
    text-align:left;
  }
  .final-cta .roofline path{ stroke:var(--gold); opacity:0.5; }
  .final-cta h2{
    color:var(--paper);
    font-size:1.9rem;
    font-weight:900;
    margin-top:16px;
  }
  .final-cta .sub{
    margin-top:14px;
    font-weight:400;
    color:rgba(255,255,255,0.7);
    max-width:38ch;
    line-height:1.6;
  }
  .final-cta .cta-group{ margin-top:28px; }
  .final-cta .btn-primary{
    background:var(--gold);
    color:var(--ink);
  }
  .final-cta .btn-primary:hover{ background:#fff; }
  .final-cta .btn-secondary{
    color:var(--paper);
    border-color:rgba(255,255,255,0.3);
  }
  .final-cta .btn-secondary:hover{ border-color:var(--paper); }

  /* ---------- Footer ---------- */
  footer{
    padding:26px 24px 34px;
    text-align:center;
  }
  footer p{
    margin:0;
    font-family:'Archivo', system-ui, sans-serif;
    font-weight:600;
    font-size:0.7rem;
    letter-spacing:0.06em;
    color:rgba(21,20,15,0.45);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  /* ---------- Reveal on scroll ---------- */
  .reveal{
    opacity:0;
    transform:translateY(18px);
    transition:opacity 1.3s ease, transform 1.3s ease;
  }
  .reveal.is-visible{
    opacity:1;
    transform:none;
  }
  @media (prefers-reduced-motion: reduce){
    .reveal{
      opacity:1;
      transform:none;
      transition:none;
    }
  }

  /* ---------- Services-style section wrapper (reused across role pages) ---------- */
  .services{
    background:var(--paper-soft);
    padding:52px 0 60px;
  }
  .services .kicker{ margin-bottom:28px; }
  .services .kicker h2{
    font-size:1.6rem;
    font-weight:800;
    margin-top:8px;
  }
  .benefits{
    background:var(--paper-soft);
    padding:52px 0 60px;
  }
  .benefits .kicker{ margin-bottom:28px; }
  .benefits .kicker h2{
    font-size:1.6rem;
    font-weight:800;
    margin-top:8px;
  }
  .contact-section{
    background:var(--paper-soft);
    padding:52px 0 60px;
  }
  .contact-form-wrap{
    padding:56px 0 60px;
  }
  .contact-form-wrap .kicker h2{
    font-size:1.6rem;
    font-weight:800;
    margin-top:8px;
    margin-bottom:8px;
  }
  .contact-form-wrap .kicker p{
    color:rgba(21,20,15,0.68);
    font-size:0.98rem;
    max-width:46ch;
  }

  /* ---------- Duty list ---------- */
  .duty-list{
    margin-top:32px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .duty{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:4px solid var(--gold);
    padding:18px 20px;
  }
  .duty h3{
    font-size:1rem;
    font-weight:700;
    margin-bottom:6px;
  }
  .duty p{
    margin:0;
    font-weight:400;
    color:rgba(21,20,15,0.68);
    font-size:0.96rem;
    line-height:1.6;
  }
  .role-note{
    margin-top:18px;
    font-size:0.88rem;
    color:rgba(21,20,15,0.55);
    max-width:60ch;
  }

  /* ---------- Role cards (junta.html overview) ---------- */
  .role-list{
    display:grid;
    gap:20px;
    margin-top:8px;
  }
  .role-card{
    display:block;
    background:var(--paper);
    border:1px solid var(--line);
    border-left:4px solid var(--gold);
    padding:24px 22px;
    text-decoration:none;
    transition:transform .2s ease, border-color .2s ease;
  }
  .role-card:hover{ transform:translateY(-2px); border-color:var(--ink); }
  .role-card h3{
    font-size:1.2rem;
    font-weight:800;
    margin-bottom:8px;
  }
  .role-card p{
    margin:0 0 10px;
    font-weight:400;
    color:rgba(21,20,15,0.68);
    font-size:0.97rem;
    line-height:1.6;
  }
  .role-card .go{
    font-family:'Archivo', system-ui, sans-serif;
    font-weight:700;
    font-size:0.85rem;
    color:var(--gold-deep);
  }
  @media (min-width:720px){
    .role-list{ grid-template-columns:repeat(2,1fr); }
  }

  /* ---------- Rate widget ---------- */
  .rate-widget{
    background:var(--ink);
    color:var(--paper);
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:8px;
  }
  .rate-widget .eyebrow{ color:var(--gold); }
  .rate-value{
    font-family:'Archivo', system-ui, sans-serif;
    font-weight:900;
    font-size:2rem;
    letter-spacing:-0.02em;
  }
  .rate-meta{
    font-size:0.82rem;
    color:rgba(255,255,255,0.6);
  }

  /* ---------- Summary cards ---------- */
  .summary-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    margin-top:24px;
  }
  .summary-card{
    background:var(--paper);
    border:1px solid var(--line);
    padding:18px;
    text-align:center;
  }
  .summary-num{
    font-family:'Archivo', system-ui, sans-serif;
    font-weight:900;
    font-size:1.9rem;
  }
  .summary-label{
    font-size:0.78rem;
    color:rgba(21,20,15,0.6);
    margin-top:4px;
  }
  .summary-note{
    margin-top:14px;
    font-size:0.85rem;
    color:rgba(21,20,15,0.55);
  }
  @media (min-width:560px){
    .summary-grid{ grid-template-columns:repeat(4,1fr); }
  }
  .board-link{
    margin-top:20px;
    display:inline-flex;
  }

  /* ---------- Invoice form ---------- */
  .invoice-form{
    margin-top:32px;
    display:flex;
    flex-direction:column;
    gap:18px;
    max-width:520px;
  }
  .field{ display:flex; flex-direction:column; gap:7px; }
  .field label{ font-size:0.85rem; font-weight:700; }
  .field input{
    font-family:'Archivo', system-ui, sans-serif;
    font-size:1rem;
    font-weight:400;
    padding:13px 14px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper);
    color:var(--ink);
  }
  .field input:focus{
    outline:3px solid var(--gold-deep);
    outline-offset:2px;
    border-color:var(--gold-deep);
  }
  .field-row{ display:flex; gap:14px; }
  .field-row .field{ flex:1; }
  .form-note{ font-size:0.85rem; color:rgba(21,20,15,0.55); margin:-4px 0 0; }

  .verif-wrap{
    max-width:460px;
    margin:0 auto;
    padding:56px 24px 80px;
  }
  .verif-status{
    padding:16px 18px;
    font-weight:700;
    margin-bottom:20px;
  }
  .verif-status.ok{ background:#EAF4EA; color:#256029; border-left:4px solid #2E7D32; }
  .verif-status.warn{ background:#FDEAEA; color:#8a2f29; border-left:4px solid #B3453D; }
  .verif-status.info{ background:var(--paper-soft); color:var(--ink); border-left:4px solid var(--gold); }
  .visit-data{
    border:1px solid var(--line);
    padding:20px;
  }
  .visit-data p{ margin:0 0 10px; font-size:0.98rem; }
  .visit-data p:last-child{ margin-bottom:0; }
  .visit-data strong{ display:inline-block; min-width:150px; }
</style>

<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand-link">
        <svg class="brandmark" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M2 32 L11 14 L20 32 Z M14 32 L23 8 L32 32 Z M26 32 L32 20 L38 32 Z"/>
        </svg>
        <span class="brandtext">
          <span>CONJUNTO RESIDENCIAL</span>
          <strong>VISTA REAL</strong>
        </span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="siteNav">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="siteNav">
        <a href="index.html" aria-current="page">Inicio</a>
        <a href="nuestros-servicios.html">Servicios</a>
        <a href="sobre-mi.html">Sobre nosotros</a>
        <a href="login-junta.html">Junta</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <div class="verif-wrap">
    <span class="eyebrow">Control de acceso</span>
    <h1 style="font-size:1.8rem;margin-top:8px;">Verificar visita</h1>
    <div id="statusBox" class="verif-status info">Buscando el código…</div>
    <div id="dataBox"></div>
  </div>


  <footer>
    <p>Conjunto Residencial Vista Real</p>
  </footer>

  <script>
    (function(){
      var toggle = document.getElementById('navToggle');
      var nav = document.getElementById('siteNav');
      if(toggle && nav){
        toggle.addEventListener('click', function(){
          var expanded = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', String(!expanded));
          nav.classList.toggle('is-open');
        });
        nav.querySelectorAll('a').forEach(function(link){
          link.addEventListener('click', function(){
            nav.classList.remove('is-open');
            toggle.setAttribute('aria-expanded', 'false');
          });
        });
      }
    })();

    (function(){
      var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var items = document.querySelectorAll('.reveal');
      if(prefersReduced || !('IntersectionObserver' in window)){
        items.forEach(function(el){ el.classList.add('is-visible'); });
        return;
      }
      var observer = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if(entry.isIntersecting){
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
      items.forEach(function(el){ observer.observe(el); });
    })();
  </script>
  <script>
    var db = firebase.firestore();
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    var statusBox = document.getElementById('statusBox');
    var dataBox = document.getElementById('dataBox');

    function fmtHora(ts){
      if(!ts) return '';
      return ts.toDate().toLocaleString('es-VE');
    }

    function pintarDatos(d){
      dataBox.innerHTML =
        '<div class="visit-data">' +
          '<p><strong>Nombre:</strong> ' + (d.nombre||'') + '</p>' +
          '<p><strong>Cédula:</strong> ' + (d.cedula||'') + '</p>' +
          '<p><strong>Casa que visita:</strong> ' + (d.casa||'') + '</p>' +
          '<p><strong>Vehículo:</strong> ' + (d.vehiculo||'—') + '</p>' +
          '<p><strong>Placa:</strong> ' + (d.placa||'—') + '</p>' +
        '</div>';
    }

    if(!id){
      statusBox.className = 'verif-status warn';
      statusBox.textContent = 'Este link no tiene un código válido.';
    } else {
      var ref = db.collection('visitas').doc(id);
      ref.get().then(function(doc){
        if(!doc.exists){
          statusBox.className = 'verif-status warn';
          statusBox.textContent = 'Código no encontrado o inválido.';
          return;
        }
        var d = doc.data();
        pintarDatos(d);
        var ahora = new Date();
        var expira = d.expiraEn ? d.expiraEn.toDate() : null;

        if(d.ingresoRegistrado){
          statusBox.className = 'verif-status info';
          statusBox.textContent = 'Esta visita ya fue registrada' + (d.horaIngreso ? (' el ' + fmtHora(d.horaIngreso)) : '') + '.';
          return;
        }
        if(expira && ahora > expira){
          statusBox.className = 'verif-status warn';
          statusBox.textContent = 'Este código venció a las ' + expira.toLocaleTimeString('es-VE', {hour:'2-digit', minute:'2-digit'}) + '.';
          return;
        }

        statusBox.className = 'verif-status ok';
        statusBox.innerHTML = 'Código vigente hasta las ' + expira.toLocaleTimeString('es-VE', {hour:'2-digit', minute:'2-digit'}) + '.';

        var btn = document.createElement('button');
        btn.className = 'btn btn-primary';
        btn.style.marginTop = '16px';
        btn.textContent = 'Registrar entrada';
        btn.addEventListener('click', function(){
          btn.disabled = true;
          btn.textContent = 'Registrando…';
          ref.update({
            ingresoRegistrado: true,
            horaIngreso: firebase.firestore.Timestamp.fromDate(new Date())
          }).then(function(){
            statusBox.className = 'verif-status ok';
            statusBox.textContent = 'Entrada registrada correctamente.';
            btn.remove();
          }).catch(function(err){
            btn.disabled = false;
            btn.textContent = 'Registrar entrada';
            statusBox.className = 'verif-status warn';
            statusBox.textContent = 'No se pudo registrar: ' + err.message;
          });
        });
        dataBox.appendChild(btn);
      }).catch(function(err){
        statusBox.className = 'verif-status warn';
        statusBox.textContent = 'No se pudo consultar el código: ' + err.message;
      });
    }
  </script>

</body>
